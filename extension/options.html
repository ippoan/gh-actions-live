<!doctype html>
<meta charset="utf-8">
<title>GitHub Actions Live — 設定</title>
<style>
  body { font:14px/1.6 -apple-system,"Segoe UI","Hiragino Sans",sans-serif;
         max-width:720px; margin:2rem auto; padding:0 1rem; color:#1f2328; }
  @media (prefers-color-scheme: dark){ body{background:#0d1117;color:#e6edf3}
    textarea,input{background:#161b22;color:#e6edf3;border-color:#30363d} }
  h1{font-size:1.2rem} label{display:block;margin:1rem 0 .25rem;font-weight:600}
  textarea{width:100%;height:7rem;padding:.5rem;border:1px solid #d0d7de;border-radius:6px;
           font-family:ui-monospace,monospace;font-size:13px}
  button{margin-top:1rem;padding:.5rem 1rem;border-radius:6px;border:1px solid #d0d7de;cursor:pointer}
  .hint{opacity:.7;font-size:12px;font-weight:400}
  pre{background:rgba(127,127,127,.12);padding:.75rem;border-radius:6px;overflow-x:auto;font-size:12px}
</style>
<h1>GitHub Actions Live</h1>

<label>監視する repo <span class="hint">1 行に 1 つ、<code>owner/repo</code></span></label>
<textarea id="repos" placeholder="owner/repo"></textarea>

<label><input type="checkbox" id="notify"> 失敗・新規 run をデスクトップ通知する</label>

<label>Linux 側リレーの URL <span class="hint">任意。<code>ws://&lt;host&gt;:8799</code>。入れるとイベントを Claude Code 側へ流し、向こうからウィンドウを開ける</span></label>
<input type="text" id="bridgeUrl" placeholder="ws://100.112.41.87:8799" style="width:100%;padding:.5rem;border:1px solid #d0d7de;border-radius:6px;font-family:ui-monospace,monospace;font-size:13px">

<button id="save">保存</button>

<label>ウィンドウを開く</label>
<div style="display:flex;gap:.5rem;flex-wrap:wrap">
  <button data-mode="popup">独立ウィンドウ</button>
  <button data-mode="maximized">最大化</button>
  <button data-mode="fullscreen">全画面</button>
  <button data-mode="tab">タブ</button>
</div>

<h2 style="font-size:1rem">生の push ペイロード <span class="hint">形が未文書なのでサンプルを保存しています</span></h2>
<pre id="raw">(まだ無し)</pre>
<script src="options.js"></script>
