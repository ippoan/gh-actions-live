<!doctype html>
<meta charset="utf-8">
<title>GitHub Alive Watch</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1f2328; --dim:#59636e; --line:#d1d9e0; --card:#ffffff; --card2:#f6f8fa;
    --ok:#1a7f37; --run:#bf8700; --bad:#cf222e; --idle:#59636e; --accent:#0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --dim:#9198a1; --line:#30363d; --card:#151b23; --card2:#0d1117;
            --ok:#3fb950; --run:#d29922; --bad:#f85149; --idle:#7d8590; --accent:#4493f8; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 -apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; }

  header { display:flex; align-items:center; gap:.6rem; padding:.55rem .9rem;
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; background:var(--bg); }
  h1 { font-size:.9rem; margin:0; font-weight:600; letter-spacing:.01em; }
  .grow { flex:1; }
  .pill { font-size:11px; padding:.15rem .55rem; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .live { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 currentColor; }
  .live.off { background:var(--bad); }
  .live.on { animation:pulse 2s ease-out infinite; color:var(--ok); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)} 100%{box-shadow:0 0 0 7px rgba(63,185,80,0)} }
  button { font:inherit; font-size:12px; padding:.28rem .6rem; border-radius:6px;
           border:1px solid var(--line); background:var(--card2); color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--accent); }

  /* repo ごとに 1 列。並列に走っている repo が横に並ぶ */
  main { display:grid; gap:.9rem; padding:.9rem;
         grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); align-items:start; }
  section { border:1px solid var(--line); border-radius:10px; background:var(--card2); overflow:hidden; }
  section > h2 { margin:0; padding:.5rem .75rem; font-size:12px; font-weight:600;
                 border-bottom:1px solid var(--line); display:flex; align-items:center; gap:.5rem;
                 font-family:ui-monospace,monospace; position:sticky; top:0; background:var(--card2); }
  .count { margin-left:auto; font-weight:400; color:var(--dim); font-size:11px; }
  .cards { display:flex; flex-direction:column; gap:1px; background:var(--line); }

  .card { background:var(--card); padding:.6rem .75rem; display:grid;
          grid-template-columns:auto 1fr auto; gap:.15rem .6rem; align-items:start;
          /* カード全体が <a> なので、既定のリンク色 / 下線を明示的に打ち消す。
             これをやらないと本文が青紫の下線だらけで読めない。 */
          color:var(--fg); text-decoration:none; }
  .card:visited { color:var(--fg); }
  .card:hover { background:var(--card2); }
  .card:hover .ttl { text-decoration:underline; }
  .card .dot { grid-row:1/3; width:12px; height:12px; border-radius:50%; margin-top:.2rem; }
  .s-ok  .dot{background:var(--ok)}   .s-run .dot{background:var(--run)}
  .s-bad .dot{background:var(--bad)}  .s-idle .dot{background:var(--idle)}
  .s-run .dot { animation:pulse 1.6s ease-out infinite; color:var(--run); }
  .s-run { background:linear-gradient(90deg, color-mix(in srgb, var(--run) 8%, transparent), transparent 60%); }
  .s-bad { background:linear-gradient(90deg, color-mix(in srgb, var(--bad) 9%, transparent), transparent 60%); }

  .ttl { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { grid-column:2; color:var(--dim); font-size:11.5px;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .when { grid-column:3; grid-row:1/3; text-align:right; color:var(--dim); font-size:11px;
          font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tag { display:inline-block; font-family:ui-monospace,monospace; font-size:10.5px;
         padding:0 .35rem; border-radius:999px; border:1px solid var(--line); color:var(--dim); margin-left:.35rem; }
  .empty { padding:3rem 1rem; text-align:center; color:var(--dim); grid-column:1/-1; }
</style>

<header>
  <span class="live" id="live"></span>
  <h1>GitHub Alive Watch</h1>
  <span class="pill" id="meta">…</span>
  <span class="pill" id="bridge" title="Linux 側リレー (設定で URL を入れると繋ぐ)">bridge: —</span>
  <span class="pill" id="ver" title="動いている版 / GitHub Release の最新版"></span>
  <button id="update" style="display:none" title="GitHub Release の最新版に更新 (native host 経由で update.ps1 を実行し、拡張が自分でリロードする)">更新</button>
  <span class="grow"></span>
  <button id="reload" title="拡張を再起動する (background ごと)。ディスク上に新版があればそれも拾う">再読込</button>
  <button id="opts">設定</button>
</header>

<main id="grid"><div class="empty" id="empty">まだイベントがありません。設定で repo を追加してください。</div></main>
<script type="module" src="dashboard.js"></script>
