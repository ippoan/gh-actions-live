name: Release

# 拡張 zip + perUser MSI を GitHub Release に添付する。
# 既存実装 (ippoan/cc-webreview-ext:.github/workflows/release.yml) の構成に合わせるが、
# native host を持たないので Rust build / cargo-wix / minisign (self-update 用署名) は無い。
#
# 起動経路は 2 つ:
#   1. workflow_call — ci.yml が PR から呼ぶ。tag `dev-<run_number>` の prerelease を PR head に打つ
#   2. push tags 'v*'  — stable。tag をそのまま Release にする (非 prerelease = Latest)

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release の tag 名 (例 dev-123)。未指定なら push された tag を使う。'
        required: true
        type: string
      target_commitish:
        description: 'tag を打つ先の SHA (PR head)。checkout もこの ref で行う。'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # tag 名は $() 等を含み得るので run へ直接 ${{ }} 展開しない
      TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_commitish || '' }}

      - name: Compute version (dev-N -> 0.0.N / vX.Y.Z -> X.Y.Z)
        id: ver
        shell: bash
        run: |
          if [[ "$TAG" =~ ^dev-([0-9]+)$ ]]; then
            echo "version=0.0.${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag が想定形式 (dev-N / vX.Y.Z) ではない: $TAG"
            exit 1
          fi

      - name: Stamp manifest version
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p='extension/manifest.json';const m=JSON.parse(fs.readFileSync(p));m.version=process.env.VER;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n')"
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
          echo "manifest version -> $VER"

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build MSI
        shell: pwsh
        run: |
          wix build installer/main.wxs `
            -d Version=${{ steps.ver.outputs.version }} `
            -o "gh-actions-live-${{ steps.ver.outputs.version }}-x64.msi"

      - name: Package extension zip + sha256
        # windows-latest に zip コマンドが無いので Compress-Archive を使う
        shell: pwsh
        run: |
          $zip = "gh-actions-live-extension-$env:TAG.zip"
          Compress-Archive -Path "extension/*" -DestinationPath $zip -Force
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item $zip dist/
          Move-Item *.msi dist/
          Get-ChildItem dist | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
          Get-ChildItem dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ inputs.target_commitish || '' }}
          # `-dev-`/`dev-` を含む tag は prerelease。揃えないと dev が "Latest" を奪う。
          prerelease: ${{ startsWith(inputs.tag_name || github.ref_name, 'dev-') }}
          files: dist/*
          fail_on_unmatched_files: true
