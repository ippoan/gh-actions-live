name: Release

# 拡張 zip + perUser MSI を GitHub Release に添付する。
# 既存実装 (ippoan/cc-webreview-ext:.github/workflows/release.yml) の構成に合わせるが、
# native host を持たないので Rust build / cargo-wix / minisign (self-update 用署名) は無い。
#
# バージョンは自動採番する。直近の `v*` tag の patch を +1、tag が無ければ 0.0.1 から。
# 手で tag を打つ経路は持たない (二重採番になるため) — 任意の版を切りたい場合は
# workflow_dispatch の `version` に指定する。
#
# 起動経路は 3 つ:
#   1. push branches main — stable。次の版を採番して `vX.Y.Z` の Release を作る (Latest)
#   2. workflow_call      — ci.yml が PR から呼ぶ。`dev-<run_number>` の prerelease を PR head に打つ
#   3. workflow_dispatch  — 版を明示して手動で切る
#
# NOTE: tag は softprops/action-gh-release が Release 作成時に打つ。GITHUB_TOKEN で
# 打った tag は他の workflow を起動しないので、tag push を経由した chaining はしない
# (この job 内で build から Release 作成まで完結させる)。

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag_name:
        description: 'Release の tag 名 (例 dev-123)。'
        required: true
        type: string
      target_commitish:
        description: 'tag を打つ先の SHA (PR head)。checkout もこの ref で行う。'
        required: true
        type: string
    secrets:
      CRX_PRIVATE_KEY:
        description: |
          .crx 署名鍵 (PEM)。extension/manifest.json の `key` と同一の鍵。
          workflow_call では secret が自動で渡らないため、ここで宣言して
          caller 側から `secrets: inherit` で渡す必要がある。
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: '切りたい版 (例 1.2.0)。空なら自動採番。'
        required: false
        type: string

permissions:
  contents: write

# 連続 push で同じ版を二重採番しないよう直列化する。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_commitish || '' }}
          # 採番のため tag を全部持ってくる
          fetch-depth: 0

      - name: Resolve version / tag
        id: ver
        shell: bash
        env:
          DEV_TAG: ${{ inputs.tag_name }}
          MANUAL: ${{ inputs.version }}
        run: |
          set -euo pipefail
          last=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -z "$last" ]; then
            next="0.0.1"
          else
            base="${last#v}"
            IFS=. read -r a b c <<< "$base"
            next="${a}.${b}.$((c + 1))"
          fi
          echo "直近の tag: ${last:-(なし)} -> 次の版: $next"

          if [ -n "${MANUAL:-}" ]; then
            if [[ ! "$MANUAL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version が X.Y.Z 形式ではない: $MANUAL"; exit 1
            fi
            version="$MANUAL"; tag="v$MANUAL"; pre=false
          elif [ -n "${DEV_TAG:-}" ]; then
            # dev prerelease。版は「次に出る stable と同じ」= その PR が出す予定の版。
            version="$next"; tag="$DEV_TAG"; pre=true
          else
            version="$next"; tag="v$next"; pre=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre"  >> "$GITHUB_OUTPUT"
          echo "-> tag=$tag version=$version prerelease=$pre"

      - name: Stamp manifest version
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p='extension/manifest.json';const m=JSON.parse(fs.readFileSync(p));m.version=process.env.VER;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n')"
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
          echo "manifest version -> $VER"

      - name: Pack CRX (署名) + update.xml
        # Chrome ポリシー (force_installed) で配るには署名済み .crx と update manifest が要る。
        # 署名鍵は repo secret CRX_PRIVATE_KEY。manifest の `key` と同じ鍵なので
        # 拡張 ID は oaadakmclelmnaieokjbhldfacfckaaj で一致する。
        # 梱包は Chrome 本体の --pack-extension を使う (windows-latest に同梱されており、
        # 追加の npm 依存を持ち込まない)。
        shell: pwsh
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          VER: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CRX_PRIVATE_KEY)) {
            throw "CRX_PRIVATE_KEY が空 (repo secret 未設定)"
          }
          $chrome = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw "chrome.exe が見つからない (runner image の変更?)" }
          $key = Join-Path $PWD 'crx-key.pem'
          $env:CRX_PRIVATE_KEY | Out-File -Encoding ascii -NoNewline $key
          & $chrome --pack-extension="$PWD\extension" --pack-extension-key="$key" --no-message-box
          $crx = "$PWD\extension.crx"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $crx); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $crx)) { throw "extension.crx が生成されなかった" }
          Remove-Item $key -Force
          Move-Item $crx "gh-actions-live.crx" -Force
          # update manifest。codebase も この XML 自身も releases/latest/download/... の
          # 固定 URL を指す。常に最新 Release の asset に解決されるので、版が上がっても
          # ポリシー側の URL を書き換えなくてよい。
          $codebase = "https://github.com/$env:REPO/releases/latest/download/gh-actions-live.crx"
          @(
            "<?xml version='1.0' encoding='UTF-8'?>",
            "<gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>",
            "  <app appid='oaadakmclelmnaieokjbhldfacfckaaj'>",
            "    <updatecheck codebase='$codebase' version='$env:VER' />",
            "  </app>",
            "</gupdate>"
          ) | Set-Content -Encoding utf8 "update.xml"
          Get-Item gh-actions-live.crx, update.xml

      - name: Install WiX
        # バージョンを固定する。無指定だと v7 が入り、WiX v6 以降で導入された
        # Open Source Maintenance Fee (OSMF) の EULA 同意を要求して
        # `error WIX7015` で落ちる。v5 は EULA 不要で、installer/main.wxs の
        # v4 スキーマ (`Files` 要素 / `Scope="perUser"`) をそのまま解釈できる。
        # v6+ に上げる場合は OSMF の可否を先に判断すること。
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          wix build installer/main.wxs `
            -d Version=${{ steps.ver.outputs.version }} `
            -o "gh-actions-live-${{ steps.ver.outputs.version }}-x64.msi"

      - name: Package extension zip + sha256
        # windows-latest に zip コマンドが無いので Compress-Archive を使う
        shell: pwsh
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $zip = "gh-actions-live-extension-$env:TAG.zip"
          Compress-Archive -Path "extension/*" -DestinationPath $zip -Force
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item $zip dist/
          Move-Item *.msi dist/
          Move-Item gh-actions-live.crx dist/
          Move-Item update.xml dist/
          Get-ChildItem dist | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
          Get-ChildItem dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ inputs.target_commitish || '' }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
